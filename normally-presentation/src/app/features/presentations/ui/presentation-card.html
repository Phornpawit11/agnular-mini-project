<article class="rounded-lg border border-slate-200 bg-white p-5 shadow-sm">
  <div class="flex items-start justify-between gap-4">
    <div>
      <h2 class="text-lg font-semibold text-slate-950">{{ presentation().title }}</h2>
      <p class="mt-2 text-sm leading-6 text-slate-600">{{ presentation().description }}</p>
    </div>
    <span class="shrink-0 rounded-md bg-emerald-50 px-2 py-1 text-xs font-medium text-emerald-700">
      {{ statusLabel() }}
    </span>
  </div>

  <dl class="mt-5 grid gap-3 text-sm text-slate-700 sm:grid-cols-2">
    <div>
      <dt class="font-medium text-slate-950">ผู้นำเสนอ</dt>
      <dd class="mt-1">{{ presentation().speaker }}</dd>
    </div>
    <div>
      <dt class="font-medium text-slate-950">วันนำเสนอ</dt>
      <dd class="mt-1">{{ presentation().scheduledAt | date: 'mediumDate' }}</dd>
    </div>
  </dl>
</article>
