<main class="min-h-dvh bg-slate-50 px-4 py-8 text-slate-950 sm:px-6 lg:px-8">
  <div class="mx-auto max-w-5xl">
    <header class="mb-8">
      <p class="text-sm font-medium text-emerald-700">Normally Presentation</p>
      <h1 class="mt-2 text-3xl font-semibold">รายการ Presentation</h1>
      <p class="mt-3 max-w-2xl text-sm leading-6 text-slate-600">
        ตัวอย่าง feature-first architecture แบบเบา ๆ สำหรับ Angular standalone app
      </p>
    </header>

    <div class="mb-5 flex items-center justify-between gap-4">
      <div>
        <p class="text-sm text-slate-600">ทั้งหมด {{ presentations().length }} รายการ</p>
        <p class="text-sm text-slate-600">ยัง active {{ activePresentations().length }} รายการ</p>
      </div>
    </div>

    <app-presentation-list [presentations]="presentations()" />
  </div>
</main>
